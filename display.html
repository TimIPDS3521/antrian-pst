<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layar Antrian Perpustakaan</title>
    <link rel="icon" type="image/png" href="images/logo-bps.png?v=1">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'Poppins',sans-serif;
        }
    </style>
</head>

<body class="bg-[#f5efe9] text-slate-800 min-h-screen px-4 py-5 md:p-8">

<div class="max-w-6xl mx-auto">

    <!-- Tombol Kembali -->
    <button
        onclick="kembali()"
        class="mb-6 flex items-center gap-2 text-sm text-slate-500 hover:text-[#7a2418] transition">

        <span>&larr;</span>
        Kembali ke Tiket

    </button>

    <!-- HEADER -->
    <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-6 mb-8">

        <!-- Logo + Judul -->
        <div class="flex items-center gap-4">

            <img
                src="images/logo-bps.png"
                alt="Logo BPS"
                class="h-16 md:h-20 w-auto flex-shrink-0 object-contain">

            <div>

                <h1 class="text-3xl md:text-5xl font-extrabold leading-tight text-[#7a2418]">
                    Antrian PST BPS
                </h1>

                <p class="text-2xl md:text-4xl font-bold text-[#7a2418]">
                    Kabupaten Ngawi
                </p>

            </div>

        </div>

        <!-- Jam -->
        <div class="text-left md:text-right">

            <p
                id="jam"
                class="text-base md:text-xl text-slate-500 font-semibold leading-relaxed">
            </p>

        </div>

    </div>

    <!-- Sedang Dipanggil -->
    <p class="uppercase tracking-wide text-slate-500 text-sm font-semibold mb-4">
        Sedang Dipanggil
    </p>

    <div
        id="dipanggil"
        class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10 min-h-[120px]">

        <p class="text-slate-400 text-sm sm:col-span-2">
            Belum ada nomor yang dipanggil.
        </p>

    </div>

    <!-- Menunggu -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

        <!-- Jalur Umum -->
        <div class="bg-white rounded-2xl border border-[#7a2418]/20 shadow-sm p-6">

            <p class="text-center text-slate-500 text-lg">
                Menunggu —
            </p>

            <p class="text-center text-slate-500 text-lg mb-2">
                Jalur Umum
            </p>

            <p
                id="menunggu-reguler"
                class="text-center text-5xl font-bold text-[#7a2418]">
                0
            </p>

        </div>

        <!-- Jalur Disabilitas -->
        <div class="bg-white rounded-2xl border border-amber-300 shadow-sm p-6">

            <p class="text-center text-slate-500 text-lg">
                Menunggu —
            </p>

            <p class="text-center text-slate-500 text-lg mb-2">
                Jalur Disabilitas
            </p>

            <p
                id="menunggu-disabilitas"
                class="text-center text-5xl font-bold text-amber-600">
                0
            </p>

        </div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
function kembali() {

    if (document.referrer &&
        document.referrer.includes(window.location.origin)) {

        window.history.back();

    } else {

        window.location.href = 'index.html';

    }

}

// Update Jam
function updateJam() {

    const sekarang = new Date();

    document.getElementById("jam").textContent =
        sekarang.toLocaleString("id-ID", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });

}

updateJam();
setInterval(updateJam,1000);


// =============================
// Refresh Data
// =============================

async function refreshData(){

    try{

        const data = await api.get('displayData');

        const box = document.getElementById("dipanggil");

        if(data.sedang_dipanggil.length===0){

            box.innerHTML=`

                <div class="sm:col-span-2 bg-white rounded-2xl p-8 shadow-sm border border-slate-200">

                    <p class="text-center text-slate-400 text-lg">

                        Belum ada nomor yang dipanggil.

                    </p>

                </div>

            `;

        }else{

            box.innerHTML=data.sedang_dipanggil.map(a=>`

                <div class="rounded-2xl p-6 shadow-sm transition

                    ${
                        a.kategori==='disabilitas'

                        ? 'bg-amber-50 border border-amber-300'

                        : 'bg-[#7a2418]/5 border border-[#7a2418]/30'

                    }">

                    <p class="text-4xl md:text-5xl font-extrabold

                        ${
                            a.kategori==='disabilitas'

                            ? 'text-amber-600'

                            : 'text-[#7a2418]'

                        }">

                        ${esc(a.nomor_antrian)}

                    </p>

                    <p class="mt-3 text-slate-600 text-lg font-medium">

                        ${esc(a.nama)}

                    </p>

                    <p class="text-sm mt-1 uppercase tracking-wide

                        ${
                            a.kategori==='disabilitas'

                            ? 'text-amber-600'

                            : 'text-[#7a2418]'

                        }">

                        ${esc(a.kategori)}

                    </p>

                </div>

            `).join('');

        }

        document.getElementById("menunggu-reguler").textContent =
            data.menunggu.reguler;

        document.getElementById("menunggu-disabilitas").textContent =
            data.menunggu.disabilitas;

    }catch(e){

        console.error(e);

    }

}

refreshData();

poll(refreshData,5000);

</script>

</body>
</html>
