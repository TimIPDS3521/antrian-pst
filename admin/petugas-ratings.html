<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating Petugas</title>
    <link rel="icon" type="image/png" href="../images/logo-bps.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="app"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>

if (ADMIN.require()) (async function () {
    const page = ADMIN.shell('Rating Petugas', 'petugas');
    const q = new URLSearchParams(window.location.search);
    const id = q.get('id');
    function urlFor(p) { const n = new URLSearchParams(q); n.set('page', p); return 'petugas-ratings.html?' + n.toString(); }

    let pg;
    try { pg = await ADMIN.call('petugasRatings', { id: Number(id), page: q.get('page') || 1 }); }
    catch (e) { page.innerHTML = '<p class="text-sm text-red-600">' + esc(e.message || 'Data tidak ditemukan.') + '</p>'; return; }
    const p = pg.petugas;
    const judul = 'Rating Petugas: ' + p.nama;
    document.title = judul;
    document.querySelector('header h1').textContent = judul;

    const kartu = pg.data.length ? pg.data.map(a => `
            <div class="bg-white rounded-xl shadow-sm p-5">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-medium text-slate-700">${esc(a.nama)} &middot; ${esc(a.nomor_antrian)}</span>
                    <span class="text-amber-500">
                        ${[1, 2, 3, 4, 5].map(i => (i <= a.rating ? '⭐' : '☆')).join(' ')}
                    </span>
                </div>
                ${a.catatan_rating ? `<p class="text-sm text-slate-600 italic">"${esc(a.catatan_rating)}"</p>` : ''}
                <p class="text-xs text-slate-400 mt-2">${esc(ADMIN.tglJam(a.rating_at))}</p>
            </div>`).join('')
        : '<div class="bg-white rounded-xl shadow-sm p-8 text-center text-slate-400">Belum ada penilaian untuk petugas ini.</div>';

    page.innerHTML = `
<div class="max-w-3xl">
    <a href="petugas.html" class="text-sm text-slate-500 mb-4 inline-block">&larr; Kembali</a>

    <div class="bg-white rounded-xl shadow-sm p-6 mb-5">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full overflow-hidden bg-[#7a2418]/10 flex items-center justify-center text-[#7a2418] font-semibold text-xl flex-shrink-0">
                ${ADMIN.fotoHtml(p, 'w-full h-full object-cover')}
            </div>
            <div>
                <p class="font-semibold text-slate-800">${esc(p.nama)}</p>
                <p class="text-xs text-slate-400 capitalize">Bertugas hari ${esc(p.hari)}</p>
                ${pg.rata_rating ? `<p class="text-sm text-amber-600 font-medium mt-1">⭐ ${pg.rata_rating} dari ${pg.jumlah_rating} penilaian</p>` : ''}
            </div>
        </div>
    </div>

    <div class="space-y-3">${kartu}</div>

    <div class="mt-4">${ADMIN.pagination(pg, urlFor)}</div>
</div>`;
})();

    </script>
</body>
</html>
