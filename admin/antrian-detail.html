<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Antrian</title>
    <link rel="icon" type="image/png" href="../images/logo-bps.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="app"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>

if (ADMIN.require()) (async function () {
    const page = ADMIN.shell('Detail Antrian', 'antrian');
    const id = new URLSearchParams(window.location.search).get('id');

    async function muat() {
        let a;
        try { a = await ADMIN.call('antrianShow', { id: Number(id) }); }
        catch (e) { page.innerHTML = '<p class="text-sm text-red-600">' + esc(e.message || 'Data tidak ditemukan.') + '</p>'; return; }

        const judul = 'Detail Antrian ' + a.nomor_antrian;
        document.title = judul;
        document.querySelector('header h1').textContent = judul;

        const bintang = a.rating
            ? `<div class="mt-4 pt-4 border-t">
        <p class="text-xs text-slate-400 mb-1">Rating dari Pengunjung</p>
        <div class="flex items-center gap-1 text-xl">
            ${[1, 2, 3, 4, 5].map(i => `<span>${i <= a.rating ? '⭐' : '☆'}</span>`).join('')}
        </div>
        ${a.catatan_rating ? `<p class="text-sm text-slate-600 italic mt-1">"${esc(a.catatan_rating)}"</p>` : ''}
    </div>` : '';

        page.innerHTML = `
<div class="max-w-2xl">
    <a href="antrian.html" class="text-sm text-slate-500 mb-4 inline-block">&larr; Kembali ke daftar</a>

    <div class="bg-white rounded-xl shadow-sm p-6 mb-5">
        <div class="flex items-center justify-between mb-5">
            <div>
                <p class="text-3xl font-bold ${a.kategori == 'disabilitas' ? 'text-amber-600' : 'text-[#7a2418]'}">
                    ${esc(a.nomor_antrian)}
                </p>
                <p class="text-xs text-slate-400 uppercase tracking-wide">
                    ${a.kategori == 'disabilitas' ? 'Jalur Disabilitas' : 'Jalur Umum'}
                </p>
            </div>
            <span class="text-xs px-3 py-1.5 rounded-full bg-slate-100 font-medium">${esc(a.statusLabel)}</span>
        </div>

        <dl class="grid grid-cols-2 gap-4 text-sm">
            <div><dt class="text-slate-400 text-xs">Nama</dt><dd class="font-medium">${esc(a.nama)}</dd></div>
            <div><dt class="text-slate-400 text-xs">NIK</dt><dd class="font-medium">${esc(a.nik)}</dd></div>
            <div><dt class="text-slate-400 text-xs">No. HP</dt><dd class="font-medium">${esc(a.no_hp)}</dd></div>
            <div><dt class="text-slate-400 text-xs">Email</dt><dd class="font-medium">${esc(a.email || '-')}</dd></div>
            <div class="col-span-2"><dt class="text-slate-400 text-xs">Alamat</dt><dd class="font-medium">${esc(a.alamat)}</dd></div>
            <div><dt class="text-slate-400 text-xs">Waktu Daftar</dt><dd class="font-medium">${esc(ADMIN.tglJam(a.created_at))}</dd></div>
            <div><dt class="text-slate-400 text-xs">Dipanggil</dt><dd class="font-medium">${esc(ADMIN.tglJam(a.dipanggil_at) || '-')}</dd></div>
        </dl>
        ${bintang}
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6">
        <h3 class="font-semibold text-sm text-slate-800 mb-4">Ubah Status</h3>
        <form id="form-status" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-500 mb-1">Status</label>
                <select name="status" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    ${ADMIN.STATUS.map(s => `<option value="${s[0]}" ${a.status == s[0] ? 'selected' : ''}>${s[1]}</option>`).join('')}
                </select>
            </div>

            <div>
                <label class="block text-xs text-slate-500 mb-1">Catatan Admin (opsional)</label>
                <textarea name="catatan_admin" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">${esc(a.catatan_admin || '')}</textarea>
            </div>

            <button class="bg-[#7a2418] hover:bg-[#5f1c12] text-white text-sm px-5 py-2.5 rounded-lg">Simpan Perubahan</button>
        </form>
    </div>
</div>`;

        document.getElementById('form-status').addEventListener('submit', async (e) => {
            e.preventDefault();
            const f = new FormData(e.target), btn = e.target.querySelector('button');
            btn.disabled = true;
            try {
                const r = await ADMIN.call('updateStatus', { id: a.id, status: f.get('status'), catatan_admin: f.get('catatan_admin') });
                await muat();
                ADMIN.showFlash(r.message);
                window.scrollTo(0, 0);
            } catch (err) {
                alert(err.errors ? Object.values(err.errors).flat().join('\n') : (err.message || 'Gagal menyimpan.'));
                btn.disabled = false;
            }
        });
    }
    muat();
})();

    </script>
</body>
</html>
