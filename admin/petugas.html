<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Petugas</title>
    <link rel="icon" type="image/png" href="../images/logo-bps.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="app"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>

if (ADMIN.require()) (async function () {
    const page = ADMIN.shell('Kelola Petugas', 'petugas');

    async function muat() {
        let list;
        try { list = await ADMIN.call('petugasList'); }
        catch (e) { page.innerHTML = '<p class="text-sm text-red-600">' + esc(e.message || 'Gagal memuat data.') + '</p>'; return; }

        const rows = list.length ? list.map(p => `
                <tr class="hover:bg-slate-50">
                    <td class="px-4 py-3">
                        <div class="w-10 h-10 rounded-full overflow-hidden bg-[#7a2418]/10 flex items-center justify-center text-[#7a2418] font-semibold">
                            ${ADMIN.fotoHtml(p, 'w-full h-full object-cover')}
                        </div>
                    </td>
                    <td class="px-4 py-3 capitalize font-medium">${esc(p.hari)}</td>
                    <td class="px-4 py-3">${esc(p.nama)}</td>
                    <td class="px-4 py-3 text-slate-500">${esc(p.nip)}</td>
                    <td class="px-4 py-3">
                        ${p.rata_rating
                            ? `<a href="petugas-ratings.html?id=${p.id}" class="flex items-center gap-1.5 hover:underline">
                                <span class="text-amber-500 font-semibold">⭐ ${p.rata_rating}</span>
                                <span class="text-xs text-slate-400">(${p.jumlah_rating} penilaian)</span>
                            </a>`
                            : '<span class="text-xs text-slate-400">Belum ada penilaian</span>'}
                    </td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-3">
                            <a href="petugas-form.html?id=${p.id}" class="text-[#7a2418] hover:underline text-xs">Edit</a>
                            <button type="button" data-id="${p.id}" data-nama="${esc(p.nama)}" class="btn-hapus text-red-600 hover:underline text-xs">Hapus</button>
                        </div>
                    </td>
                </tr>`).join('')
            : '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">Belum ada data petugas.</td></tr>';

        page.innerHTML = `
<div class="flex items-center justify-between mb-5">
    <p class="text-sm text-slate-500">Data petugas yang bertugas per hari, ditampilkan di halaman awal & tiket antrian.</p>
    <a href="petugas-form.html" class="bg-[#7a2418] hover:bg-[#5f1c12] text-white text-sm px-4 py-2 rounded-lg">
        + Tambah Petugas
    </a>
</div>

<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-slate-50">
            <tr class="text-left text-slate-500 text-xs">
                <th class="px-4 py-3">Foto</th>
                <th class="px-4 py-3">Hari</th>
                <th class="px-4 py-3">Nama</th>
                <th class="px-4 py-3">NIP</th>
                <th class="px-4 py-3">Rating Kinerja</th>
                <th class="px-4 py-3">Aksi</th>
            </tr>
        </thead>
        <tbody class="divide-y">${rows}</tbody>
    </table>
</div>`;

        document.querySelectorAll('.btn-hapus').forEach(b => b.addEventListener('click', async () => {
            if (!confirm('Hapus petugas ' + b.dataset.nama + '?')) return;
            b.disabled = true;
            try {
                const r = await ADMIN.call('petugasDelete', { id: Number(b.dataset.id) });
                ADMIN.flash(r.message);
                window.location.reload();
            } catch (err) { alert(err.message || 'Gagal menghapus.'); b.disabled = false; }
        }));
        const f = ADMIN.takeFlash();
        if (f) ADMIN.showFlash(f);
    }
    muat();
})();

    </script>
</body>
</html>
