<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" type="image/png" href="../images/logo-bps.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="app"></div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>

if (ADMIN.require()) (async function () {
    const page = ADMIN.shell('Dashboard', 'dashboard');
    let d;
    try { d = await ADMIN.call('dashboard'); }
    catch (e) { page.innerHTML = '<p class="text-sm text-red-600">' + esc(e.message || 'Gagal memuat data.') + '</p>'; return; }

    const rows = d.antrianTerbaru.length
        ? d.antrianTerbaru.map(a => `
                <tr>
                    <td class="py-2.5 font-medium">${esc(a.nomor_antrian)}</td>
                    <td class="py-2.5">${esc(a.nama)}</td>
                    <td class="py-2.5">${a.kategori == 'disabilitas' ? 'Disabilitas' : 'Umum'}</td>
                    <td class="py-2.5">
                        <span class="text-xs px-2 py-1 rounded-full bg-[#7a2418]/10 text-[#7a2418] font-medium">${esc(a.statusLabel)}</span>
                    </td>
                </tr>`).join('')
        : '<tr><td colspan="4" class="py-6 text-center text-slate-400">Belum ada pendaftar hari ini.</td></tr>';

    page.innerHTML = `
<div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
    <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-xs text-slate-400 mb-1">Total Hari Ini</p>
        <p class="text-2xl font-bold text-slate-800">${d.totalHariIni}</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-xs text-slate-400 mb-1">Jalur Umum</p>
        <p class="text-2xl font-bold text-[#7a2418]">${d.totalReguler}</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-xs text-slate-400 mb-1">Jalur Disabilitas</p>
        <p class="text-2xl font-bold text-amber-600">${d.totalDisabilitas}</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-xs text-slate-400 mb-1">Menunggu</p>
        <p class="text-2xl font-bold text-slate-800">${d.totalMenunggu}</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-xs text-slate-400 mb-1">Selesai</p>
        <p class="text-2xl font-bold text-green-600">${d.totalSelesai}</p>
    </div>
</div>

<div class="bg-white rounded-xl shadow-sm p-5">
    <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-slate-800 text-sm">Pendaftar Terbaru</h2>
        <a href="antrian.html" class="text-xs text-[#7a2418] font-medium hover:underline">Lihat semua &rarr;</a>
    </div>
    <table class="w-full text-sm">
        <thead>
            <tr class="text-left text-slate-400 text-xs border-b">
                <th class="pb-2">No. Antrian</th>
                <th class="pb-2">Nama</th>
                <th class="pb-2">Kategori</th>
                <th class="pb-2">Status</th>
            </tr>
        </thead>
        <tbody class="divide-y">${rows}</tbody>
    </table>
</div>`;
})();

    </script>
</body>
</html>
