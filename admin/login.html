<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Antrian PST BPS Kabupaten Ngawi</title>
    <link rel="icon" type="image/png" href="../images/logo-bps.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#2b0e09] min-h-screen flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
        <div class="text-center mb-6">
            <img src="../images/logo-bps.png" alt="Logo BPS" class="h-12 w-auto object-contain mx-auto mb-2">
            <h1 class="font-semibold text-slate-800">Login Admin</h1>
            <p class="text-xs text-slate-400">Sistem Antrian PST BPS Kabupaten Ngawi</p>
        </div>

        <div id="error-box" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg"></div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required autofocus
                    class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-[#7a2418] focus:border-[#7a2418]">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-[#7a2418] focus:border-[#7a2418]">
            </div>
            <label class="flex items-center gap-2 text-xs text-slate-500">
                <input type="checkbox" name="remember"> Ingat saya
            </label>
            <button type="submit" id="btn-login" class="w-full bg-[#7a2418] hover:bg-[#5f1c12] text-white font-medium py-2.5 rounded-lg text-sm">
                Masuk
            </button>
        </form>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        const box = document.getElementById('error-box');

        // Sudah login (token masih berlaku) -> langsung ke dashboard
        if (ADMIN.token()) {
            api.post('me', { token: ADMIN.token() })
                .then(() => window.location.replace('dashboard.html'))
                .catch(() => ADMIN.clear());
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            box.classList.add('hidden');
            const f = new FormData(e.target), btn = document.getElementById('btn-login');
            btn.disabled = true; btn.textContent = 'Memproses...';
            try {
                const r = await api.post('login', { email: f.get('email'), password: f.get('password'), remember: f.get('remember') === 'on' });
                ADMIN.save(r.token, r.user, f.get('remember') === 'on');
                window.location.replace('dashboard.html');
            } catch (err) {
                const pesan = err.errors ? Object.values(err.errors).flat()[0] : (err.message || 'Terjadi kesalahan.');
                box.textContent = pesan;
                box.classList.remove('hidden');
                btn.disabled = false; btn.textContent = 'Masuk';
            }
        });
    </script>
</body>
</html>
